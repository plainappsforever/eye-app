appId: ${APP_ID}
name: Release build - Stats switch 7 and 30 days, export history, delete history
# Release builds have no Debug section: a real 20 s break is finished instead of a 3 s one.
---
- runFlow: ../subflows/launch.yaml
- tapOn:
    id: open-settings
- scrollUntilVisible:
    element:
      id: break-20
    timeout: 45000
- tapOn:
    id: break-20
- assertVisible:
    id: break-20
    selected: true
- tapOn:
    id: nav-back
- tapOn:
    id: open-stats
- assertVisible:
    id: stats-screen
- assertVisible:
    id: stats-summary
- assertVisible:
    id: stats-rhythm
- assertVisible:
    id: stats-range-7
    selected: true
- tapOn:
    id: stats-range-30
- assertVisible:
    id: stats-range-30
    selected: true
- tapOn:
    id: stats-range-7
- assertVisible:
    id: stats-range-7
    selected: true
- scrollUntilVisible:
    element:
      id: stats-delete
    timeout: 45000
- tapOn:
    id: stats-delete
- tapOn: "(?i)cancel"
- tapOn:
    id: stats-delete
- tapOn: "(?i)delete"
- scrollUntilVisible:
    element:
      id: stats-breaks
    direction: UP
    timeout: 45000
- assertVisible:
    id: stats-breaks
    text: "Taken 0 · Skipped 0 · Snoozed 0"
- assertVisible:
    id: stats-move
- assertVisible:
    id: stats-move-reminders
    text: "Move reminders: 0 · Combined with an eye break: 0"
- assertVisible:
    id: stats-move-breaks
    text: "Moved 0 · Noticed automatically 0 · Skipped 0 · Snoozed 0"
- tapOn:
    id: nav-back
- tapOn:
    id: break-now
- extendedWaitUntil:
    visible:
      id: break-done
    timeout: 40000
# Maestro iOS: an assertion right after a long wait fails at once while "Done" is still on screen; let it leave first.
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 15000
- tapOn:
    id: open-stats
- assertVisible:
    id: stats-breaks
    text: "Taken 1 · Skipped 0 · Snoozed 0"
- scrollUntilVisible:
    element:
      id: stats-export
    timeout: 45000
- tapOn:
    id: stats-export
- extendedWaitUntil:
    visible:
      text: "rest-and-move-history-.*"
    timeout: 8000
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "50%,62%"
          end: "50%,98%"
          duration: 400
- assertVisible:
    id: stats-export-status
    text: "Saved rest-and-move-history-.*\\.csv"
- scrollUntilVisible:
    element:
      id: stats-delete
    timeout: 45000
- tapOn:
    id: stats-delete
- assertVisible: "Delete history?"
- tapOn: "(?i)delete"
- scrollUntilVisible:
    element:
      id: stats-breaks
    direction: UP
    timeout: 45000
- assertVisible:
    id: stats-breaks
    text: "Taken 0 · Skipped 0 · Snoozed 0"
- tapOn:
    id: nav-back
