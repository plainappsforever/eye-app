appId: ${APP_ID}
# On the launcher: if the "Next break" widget is not on the first home-screen page (the launcher
# re-placed it on page 2 once during P7a), swipe to the next page. Test environment only.
---
- extendedWaitUntil:
    visible: "Next break in|Next move in|Paused.*|Time to look away.*|Held.*|Not counting.*|Breaks off|Moves from.*|Move due now"
    timeout: 3000
    optional: true
- runFlow:
    when:
      notVisible: "Next break in|Next move in|Paused.*|Time to look away.*|Held.*|Not counting.*|Breaks off|Moves from.*|Move due now"
    commands:
      - swipe:
          start: 90%, 50%
          end: 10%, 50%
          duration: 300
